
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Developed Form – Mr. McLean Math</title>
<style>
:root{
  --bg:#0b1226;--card:#101828;--text:#e5e7eb;--muted:#9ca3af;--line:#1f2937;
  --accent:#38bdf8;--ok:#22c55e;--bad:#ef4444;--tile:#132247;--tileHover:#1d2f5d;
  --drop:#0f1a30;--dropActive:#14304f;--shadow:0 10px 30px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:linear-gradient(180deg,#0b1226,#0e1533 70%);color:var(--text)}
.wrap{max-width:980px;margin:0 auto;padding:18px 14px 28px}
header{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
h1{margin:0;font-size:clamp(24px,3vw,34px)}
.subtitle{margin-top:5px;color:var(--muted);font-size:14px}
.tabs,.levels,.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;background:#0f172a;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:9px 12px;font-weight:800;cursor:pointer}
button.active,button.primary{background:#0c1b3a;border-color:#2a4c78}
button:disabled{opacity:.5;cursor:not-allowed}
.card{background:linear-gradient(180deg,#0f172a,#0b1226);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.label{font-size:12px;color:var(--muted);font-weight:800;margin-bottom:6px}
.number{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:clamp(38px,6vw,54px);text-align:center;margin:18px 0 8px;white-space:pre}
.prompt{text-align:center;color:#cbd5e1;margin:0 0 12px}
.drop{min-height:72px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;border:2px dashed #3b475a;border-radius:12px;background:var(--drop)}
.drop.active{border-color:var(--accent);background:var(--dropActive)}
.chip{padding:10px 12px;display:inline-flex;align-items:center;justify-content:center;background:var(--tile);border:1px solid #2a3a73;border-radius:12px;cursor:grab;font-size:17px}
.chip:hover{background:var(--tileHover)}
.chip.small{padding:8px 10px;font-size:16px}
.rackWrap{margin-top:12px}.rackTitle{color:#cbd5e1;font-size:14px;margin-bottom:6px;font-weight:800}.rack{display:flex;flex-wrap:wrap;gap:8px}
.controls{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.feedback{display:none;margin-top:12px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:#0c162a}
.feedback.ok{display:block;border-color:#134e4a;background:#052e2b}.feedback.bad{display:block;border-color:#4c1d1d;background:#2a0c0c}
.steps{display:none;margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;line-height:1.5}
.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.stat{padding:7px 11px;border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:800}
.worksheet{display:none}
.ws-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
select{font:inherit;background:#0f172a;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.wgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.wcard{position:relative;border:1px solid #334155;border-radius:12px;background:#0f1a30;padding:12px}
.wlabel{position:absolute;top:8px;left:10px;font-size:13px;color:#cbd5e1}
.wNum{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:clamp(26px,4vw,36px);text-align:center;margin:12px 0 8px}
.wans{display:none;border-top:1px dashed #334155;padding-top:8px;color:#cbd5e1}.wans.show{display:block}
.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:14px}
@media(max-width:700px){.wgrid{grid-template-columns:1fr}}
@media print{
  body{background:#fff;color:#000}.wrap{max-width:none;padding:0}
  header,#practiceCard,.no-print,.footer{display:none!important}
  #worksheetCard{display:block!important;background:#fff;color:#000;border:0;box-shadow:none;padding:0}
  .wgrid{grid-template-columns:repeat(2,1fr)}.wcard{background:#fff;color:#000;border-color:#000}.wans{display:none!important}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>Developed Form</h1>
    <div class="subtitle">Build each number from its non-zero place-value terms.</div>
  </div>
  <div class="tabs">
    <button id="practiceTab" class="active" type="button">Practice</button>
    <button id="worksheetTab" type="button">Worksheet</button>
  </div>
</header>

<section id="practiceCard" class="card">
  <div class="toolbar">
    <div>
      <div class="label">Difficulty</div>
      <div class="levels">
        <button class="level active" data-diff="easy" type="button">Foundation</button>
        <button class="level" data-diff="medium" type="button">Core</button>
        <button class="level" data-diff="hard" type="button">Challenge</button>
      </div>
    </div>
    <button id="newBtn" type="button">New Question</button>
  </div>

  <div id="questionNum" class="number"></div>
  <p class="prompt">Build the developed form by placing the correct terms below.</p>

  <div id="drop" class="drop" tabindex="0"></div>

  <div class="rackWrap">
    <div class="rackTitle">Terms</div>
    <div id="rack" class="rack"></div>
  </div>

  <div class="controls">
    <button id="clearBtn" type="button">Clear</button>
    <button id="submitBtn" class="primary" type="button">Check</button>
    <button id="nextBtn" type="button" disabled>Next</button>
  </div>

  <div id="feedback" class="feedback"></div>
  <div id="steps" class="steps"></div>

  <div class="stats">
    <div class="stat">Correct: <span id="correct">0</span></div>
    <div class="stat">Incorrect: <span id="incorrect">0</span></div>
  </div>
</section>

<section id="worksheetCard" class="card worksheet">
  <div class="ws-top">
    <div>
      <div style="font-size:19px;font-weight:900">Worksheet</div>
      <div id="wsMeta" class="subtitle">Write each number in developed form.</div>
    </div>
    <div class="row no-print">
      <label style="font-size:13px;font-weight:800">Questions
        <select id="wsCount"><option>5</option><option>10</option><option selected>15</option></select>
      </label>
      <button id="wsGen" class="primary" type="button">Generate</button>
      <button id="wsRevealAll" type="button" disabled>Reveal All</button>
      <button id="wsHideAll" type="button" disabled>Hide All</button>
      <button id="printBtn" type="button" disabled>Print</button>
    </div>
  </div>
  <div id="wsGrid" class="wgrid"></div>
</section>

<div class="footer">Created by Mr. McLean Math.</div>
</div>

<script>
(() => {
"use strict";
const $=id=>document.getElementById(id);
const randInt=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;

const DIFF={
  easy:{min:100,max:999},
  medium:{min:1000,max:99999},
  hard:{min:100000,max:9999999}
};

let difficulty="easy",current=null,evaluated=false,correct=0,incorrect=0;
const selected=new Set();

function formatSpaces(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g," ")}
function numberToTerms(n){
  const s=String(n),terms=[];
  for(let i=0;i<s.length;i++){
    const d=Number(s[i]),pow=s.length-1-i;
    if(d!==0)terms.push(d*10**pow);
  }
  return terms;
}
function genNumber(){
  const cfg=DIFF[difficulty];
  let n=randInt(cfg.min,cfg.max);
  while(/^([1-9])0+$/.test(String(n)))n=randInt(cfg.min,cfg.max);
  return n;
}
function clearDrop(){
  if(evaluated)return;
  selected.clear();$("drop").innerHTML="";
}
function addToDrop(val){
  if(evaluated||selected.has(val))return;
  selected.add(val);
  const b=document.createElement("button");b.type="button";b.className="chip small";b.textContent=formatSpaces(val);
  b.addEventListener("click",()=>{if(evaluated)return;selected.delete(val);b.remove()});
  $("drop").appendChild(b);
}
function setupDrop(){
  const d=$("drop");
  ["dragover","dragenter"].forEach(evt=>d.addEventListener(evt,e=>{e.preventDefault();d.classList.add("active")}));
  ["dragleave","drop"].forEach(evt=>d.addEventListener(evt,()=>d.classList.remove("active")));
  d.addEventListener("drop",e=>{e.preventDefault();const v=Number(e.dataTransfer.getData("text/plain"));if(Number.isFinite(v))addToDrop(v)});
}
setupDrop();

function buildRack(){
  $("rack").innerHTML="";
  const pool=new Set(current.terms),s=String(current.num),L=s.length;
  for(let i=0;i<L;i++){
    const d=Number(s[i]),pow=L-1-i;
    if(!d)continue;
    if(pow>0)pool.add(d*10**(pow-1));
    pool.add(Math.max(1,Math.min(9,d+1))*10**pow);
    pool.add(Math.max(1,d-1)*10**pow);
  }
  while(pool.size<10){const rp=randInt(0,Math.min(6,L)),rd=randInt(1,9);pool.add(rd*10**rp)}
  [...pool].sort((a,b)=>a-b).forEach(v=>{
    const b=document.createElement("button");b.type="button";b.className="chip";b.draggable=true;b.textContent=formatSpaces(v);
    b.addEventListener("dragstart",e=>e.dataTransfer.setData("text/plain",String(v)));
    b.addEventListener("click",()=>addToDrop(v));$("rack").appendChild(b);
  });
}
function newQuestion(){
  current={num:genNumber()};current.terms=numberToTerms(current.num);evaluated=false;selected.clear();
  $("questionNum").textContent=formatSpaces(current.num);$("drop").innerHTML="";buildRack();
  $("feedback").style.display="none";$("feedback").className="feedback";$("feedback").textContent="";
  $("steps").style.display="none";$("steps").innerHTML="";
  $("submitBtn").disabled=false;$("nextBtn").disabled=true;
}
function submit(){
  if(!current||evaluated)return;
  if(selected.size===0){$("feedback").style.display="block";$("feedback").className="feedback";$("feedback").textContent="Choose at least one term first.";return;}
  const your=[...selected].sort((a,b)=>b-a),corr=current.terms.slice().sort((a,b)=>b-a);
  const ok=your.length===corr.length&&your.every((v,i)=>v===corr[i]);
  evaluated=true;$("submitBtn").disabled=true;$("nextBtn").disabled=false;
  $("steps").innerHTML=`Number: <b>${formatSpaces(current.num)}</b><br>Developed form: <b>${corr.map(formatSpaces).join(" + ")}</b>`;
  if(ok){correct++;$("correct").textContent=correct;$("feedback").className="feedback ok";$("feedback").textContent="Correct!";}
  else{incorrect++;$("incorrect").textContent=incorrect;$("feedback").className="feedback bad";$("feedback").textContent=`Not quite. Correct: ${corr.map(formatSpaces).join(" + ")}`;$("steps").style.display="block";}
  $("feedback").style.display="block";
}

document.querySelectorAll(".level").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".level").forEach(x=>x.classList.remove("active"));b.classList.add("active");difficulty=b.dataset.diff;newQuestion();
}));
$("newBtn").addEventListener("click",newQuestion);$("submitBtn").addEventListener("click",submit);$("nextBtn").addEventListener("click",newQuestion);$("clearBtn").addEventListener("click",clearDrop);
document.addEventListener("keydown",e=>{
  if($("practiceCard").style.display==="none")return;
  if(e.key==="Enter"){e.preventDefault();evaluated?newQuestion():submit()}
  else if(e.key==="Escape"){e.preventDefault();clearDrop()}
});

function showPractice(){$("practiceTab").classList.add("active");$("worksheetTab").classList.remove("active");$("practiceCard").style.display="block";$("worksheetCard").style.display="none"}
function showWorksheet(){$("worksheetTab").classList.add("active");$("practiceTab").classList.remove("active");$("practiceCard").style.display="none";$("worksheetCard").style.display="block"}
$("practiceTab").addEventListener("click",showPractice);$("worksheetTab").addEventListener("click",showWorksheet);

function wsCard(n,i){
  const terms=numberToTerms(n),c=document.createElement("div");c.className="wcard";
  c.innerHTML=`<div class="wlabel">${i+1}</div><div class="wNum">${formatSpaces(n)}</div>`;
  const ans=document.createElement("div");ans.className="wans";ans.innerHTML=`Developed form: <b>${terms.map(formatSpaces).join(" + ")}</b>`;
  const b=document.createElement("button");b.type="button";b.className="no-print";b.textContent="Reveal";b.addEventListener("click",()=>{ans.classList.toggle("show");b.textContent=ans.classList.contains("show")?"Hide":"Reveal"});
  c.append(b,ans);return c;
}
function generateWs(){
  const n=Number($("wsCount").value),grid=$("wsGrid");grid.innerHTML="";
  for(let i=0;i<n;i++)grid.appendChild(wsCard(genNumber(),i));
  const labels={easy:"Foundation",medium:"Core",hard:"Challenge"};$("wsMeta").textContent=`${labels[difficulty]} • ${n} questions`;
  $("wsRevealAll").disabled=$("wsHideAll").disabled=$("printBtn").disabled=false;
}
$("wsGen").addEventListener("click",generateWs);
$("wsRevealAll").addEventListener("click",()=>document.querySelectorAll(".wans").forEach(x=>x.classList.add("show")));
$("wsHideAll").addEventListener("click",()=>document.querySelectorAll(".wans").forEach(x=>x.classList.remove("show")));
$("printBtn").addEventListener("click",()=>window.print());

window.__MMM_TEST__={numberToTerms,DIFF};
newQuestion();
})();
</script>
</body>
</html>
